name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Quality and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source and ES2 baseline
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --locked

      - name: Verify generated catalogs and M9 release gate
        shell: bash
        run: |
          catalogs=(
            village city snow temple canyon oldpine goathill choyin chuenyu green sanyen waterfog
            latemoon death graveyard jail cloud
            npcs-m4 npcs-m5 npcs-m6 npcs-m7 npc-ambient items skills
          )
          for catalog in "${catalogs[@]}"; do
            cargo run --quiet --locked --bin es2-import -- es2-utf8 "$catalog" "/tmp/$catalog.json"
            cmp "migration/catalog/$catalog.json" "/tmp/$catalog.json"
          done
          cargo run --quiet --locked --bin es2-audit -- --output /tmp/m9-release-metadata

      - name: Upload M9 acceptance metadata
        uses: actions/upload-artifact@v4
        with:
          name: m9-acceptance-metadata
          path: /tmp/m9-release-metadata/*
          if-no-files-found: error
          retention-days: 14

  build:
    name: Build ${{ matrix.name }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            artifact: eaststory-tui-linux
            binary: target/release/dongfang-tui
          - name: Windows
            os: windows-latest
            artifact: eaststory-tui-windows
            binary: target/release/dongfang-tui.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: ${{ runner.os == 'Windows' && 'false' || 'recursive' }}

      - name: Materialize Windows ES2 quest sources
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $submoduleCommit = ((git ls-tree HEAD es2-utf8) -split '\s+')[2]
          $questIds = @(
            1000, 1500, 2000, 3000, 5000, 8000, 10000, 13000,
            17000, 22000, 40000, 50000, 60000, 80000, 100000
          )

          git init --bare .es2-source
          git -C .es2-source remote add origin https://github.com/mudchina/es2-utf8.git
          git -C .es2-source -c protocol.version=2 fetch --depth=1 --filter=blob:none origin $submoduleCommit
          New-Item -ItemType Directory -Force es2-utf8/mudlib/quest | Out-Null

          foreach ($id in $questIds) {
            $sourcePath = "mudlib/quest/qlist$id.c"
            $destination = "es2-utf8/$sourcePath"
            $object = "${submoduleCommit}:$sourcePath"
            cmd.exe /d /c "git -C .es2-source show $object > $destination"
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to materialize $sourcePath"
            }

            $expected = git -C .es2-source rev-parse $object
            $actual = git hash-object $destination
            if ($actual -ne $expected) {
              throw "Blob verification failed for $sourcePath"
            }
          }

          Remove-Item -Recurse -Force .es2-source

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Run platform test suite
        if: runner.os != 'Windows'
        run: cargo test --all-targets --locked

      - name: Run Windows platform test suite
        if: runner.os == 'Windows'
        run: cargo test --lib --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Stage Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp "${{ matrix.binary }}" "dist/eaststory-tui"
          chmod +x "dist/eaststory-tui"

      - name: Stage Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "${{ matrix.binary }}" "dist/eaststory-tui.exe"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
